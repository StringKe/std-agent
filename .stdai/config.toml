version = "1.0"
inject = true
inject_whatis = false
auto_pull = false
backup = true
backup_keep = 5

# 仓库全开 11 个 target 作为 demo：让其他开发者直接看到 stdagent sync 在各家 AI CLI 工具下的产物形态。
# 在你自己项目里通常只开 2~3 个用得到的 target，无关的留 false 即可。
[targets]
claude-code  = { enabled = true,  convert = true }
codex        = { enabled = true,  convert = true }
cursor       = { enabled = true,  convert = true }
copilot      = { enabled = true,  convert = true }
windsurf     = { enabled = true,  convert = true }
gemini       = { enabled = true,  convert = true }
aider        = { enabled = true,  convert = true }
cline        = { enabled = true,  convert = true }
opencode     = { enabled = true,  convert = true }
continue-dev = { enabled = true,  convert = true }
antigravity  = { enabled = true,  convert = true }
